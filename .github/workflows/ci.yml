name: CI

# Manually triggered only — no automatic push/PR triggers.
# To run: GitHub → Actions → CI → Run workflow
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Debug or Release)
        required: false
        default: Release
        type: choice
        options: [Debug, Release]

env:
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (net6.0 + net8.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Install both LTS versions so multi-targeting works
          dotnet-version: |
            6.0.x
            8.0.x

      # ── Viewify.Base ────────────────────────────────────────────────────────
      - name: Build Viewify.Base
        run: dotnet build Viewify.Base/Viewify.Base.csproj
             --configuration ${{ env.CONFIGURATION }}
             --no-incremental

      # ── Viewify.Core ────────────────────────────────────────────────────────
      - name: Build Viewify.Core
        run: dotnet build Viewify.Core/Viewify.Core.csproj
             --configuration ${{ env.CONFIGURATION }}
             --no-incremental

      # ── Viewify.Gtk ─────────────────────────────────────────────────────────
      - name: Install GTK3 native library
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-0

      - name: Build Viewify.Gtk
        run: dotnet build Viewify.Gtk/Viewify.Gtk.csproj
             --configuration ${{ env.CONFIGURATION }}
             --no-incremental

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: dotnet test Viewify.Test/Viewify.Test.csproj
             --configuration ${{ env.CONFIGURATION }}
             --logger "trx;LogFileName=test-results.trx"
             -- RunConfiguration.TestSessionTimeout=120000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Viewify.Test/TestResults/*.trx
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  build-release-packages:
    name: Pack NuGet packages (Release)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    if: github.event.inputs.configuration == 'Release' || github.event.inputs.configuration == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Install GTK3 native library
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-0

      - name: Pack Viewify.Base
        run: dotnet pack Viewify.Base/Viewify.Base.csproj
             --configuration Release
             --output ./nupkgs

      - name: Pack Viewify.Core
        run: dotnet pack Viewify.Core/Viewify.Core.csproj
             --configuration Release
             --output ./nupkgs

      - name: Pack Viewify.Gtk
        run: dotnet pack Viewify.Gtk/Viewify.Gtk.csproj
             --configuration Release
             --output ./nupkgs

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg
          retention-days: 30
